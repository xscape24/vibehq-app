        <div class="main-content">










            <table class="settings-header">
                <tr>
                    <th class="settings-header-item">Account Profile</th>
                    <th class="settings-header-item">Connections</th>
                    <th class="settings-header-item">Notifications</th>
                    <th class="settings-header-item">Theme Settings</th>
                    <th class="settings-header-item">Log Out</th>
                </tr>

            </table>




            <div class="settings-container">

                <div class="input-container" id="username-container">
                    <div class="row-container">
                        <label for="" class="form-input-labels" id="first-name-label">First Name</label>
                        <input type="text" id="first-name" class="form-input" placeholder="Jane">
                        <label for="" class="form-input-labels" id="first-name-label">Last Name</label>
                        <input type="text" id="first-name" class="form-input" placeholder="Doe">
                        <label for="" class="form-input-labels" id="name-label">Username</label>
                        <input type="text" id="username" class="form-input" placeholder="jdoe1">
                        <button class="add-task-btn">Edit</button>
                    </div>

                </div>






                <div class="input-container" id="email-container">
                    <div class="row-container">
                        <label for="" class="form-input-labels" id="email-label">Email</label>
                        <input type="text" id="email" class="form-input" placeholder="something@example.com">
                        <button class="add-task-btn">Edit</button>
                        <label for="" class="form-input-labels" id="number-label">Phone Number</label>
                        <input type="text" id="email" class="form-input" placeholder="123-456-7890">
                        <label for="" class="form-input-labels" id="number-label">Password</label>
                        <input type="text" id="email" class="form-input" placeholder="***************">
                        <button class="add-task-btn">Change </button>
                    </div>
                </div>

                <div class="input-container" id="email-container">
                    <div class="row-container">
                        <label for="" class="form-input-labels" id="email-label">Github </label>
                        <input type="text" id="email" class="form-input" placeholder="github.com/janedoe">
                        <button class="add-task-btn">Edit</button>
                        <label for="" class="form-input-labels" id="number-label">Linkedn </label>
                        <input type="text" id="email" class="form-input" placeholder="linkedln.com/janedoe">
                        <button class="add-task-btn">Edit </button>
                        <label for="" class="form-input-labels" id="number-label">Portfolio </label>
                        <input type="text" id="email" class="form-input" placeholder="portfolio.com/janedoe">
                        <button class="add-task-btn">Edit </button>
                    </div>
                </div>

                <div class="row-container-2">
                    <div id="social-media-header">Get Connected!</div>
                    <ul id="social-media-list">
                        <li class="social-media-item" id="google-item">Connect to Google</li>
                        <li class="social-media-item" id="apple-item">Connect to Apple</li>
                        <li class="social-media-item" id="facebook-item">Connect to Facebook</li>

                    </ul>
                </div>

                   <div id="row-container-3">
                     <label for=""  id="notifications-label">Notifications</label>
                        <button id="notifications-btn">On / Off</button>

                        <label for="" id="theme-label">Change Theme</label>
                        <button id="theme-change-btn">Switch to Dark Mode</button>
                   
                </div>

            
                  
               



                <div class="skills-btn-container">
                    <button class="add-task-btn-2 cancel-btn">Cancel</button>
                    <button class="add-task-btn-2 save-changes-btn">Save Changes</button>

                </div>
